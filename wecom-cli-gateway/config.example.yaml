  #   defaultCli: claude
  #   projectDir: /home/proj/app
  #   timeout: 180
  #   allowedUsers: [zhangsan]
  #   credentials: {}

clis:
  claude:
    path: claude                  # 默认 PATH 查找,可填绝对路径
  codex:
    path: codex                   # codex CLI(配合 @openai/codex-sdk,设 CODEX_SDK_PATH)
  cursor:
    path: cursor-agent            # cursor CLI(cursor-agent)
  opencode:
    path: opencode                # opencode CLI
