server:
  port: 3002
  logLevel: info

redis:
  url: redis://localhost:6379   # 支持外部 Redis,填远程地址

bots:
  - id: wecom_1
    platform: wecom
    defaultCli: claude
    projectDir: /home/proj/app
    timeout: 180                  # CLI 执行超时(秒),可 web/配置改
    allowedUsers: [zhangsan, lisi] # 每 bot 单独白名单
    # 企微智能机器人凭证(回调加解密用 Token + EncodingAESKey)。
    # 在企微后台「智能机器人」配置页获取。回复用回调携带的 response_url,无需 corpId/secret。
    credentials:
      aesKey: "your-43-char-encoding-aes-key"  # 43 字符 EncodingAESKey
      token: "your-token"                        # 回调签名校验 Token
    # cliSwitchPrefix: "@"         # 可选,开启后支持 @codex 等切换

  # 以下为预留,本期不实现
  # - id: dingtalk_1
  #   platform: dingtalk
  #   defaultCli: claude
  #   projectDir: /home/proj/app
  #   timeout: 180
  #   allowedUsers: [zhangsan]
  #   credentials: {}
